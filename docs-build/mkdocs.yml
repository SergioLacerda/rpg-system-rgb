site_name: RGB System Library
site_description: Compiled documentation library for RGB System.
docs_dir: ../docs
site_dir: ../web/landing/public/library
use_directory_urls: true
exclude_docs: |
  adr/*
  architecture/*
  engineering/*
  plans/*
  overrides/*
  core/README.md
  core/semantic/*
theme:
  name: mkdocs
  custom_dir: ../docs/overrides
  color_mode: dark
  nav_style: dark
extra_css:
  - styles/rgb-library.css

nav:
  - Core Overview: core/en/README.md
  - Introduction:
      - Quick Start: core/en/introduction/quick_start.md
      - RGB One Page Rules: core/en/introduction/rgb_one_page_rules.md
      - System Overview: core/en/introduction/system_overview.md
  - Core Rules:
      - Overview: core/en/core/README.md
      - Attributes: core/en/core/attributes.md
      - Character Creation: core/en/core/character_creation.md
      - Progression: core/en/core/progression.md
      - Skills and Abilities: core/en/core/skills_and_abilities.md
  - Combat:
      - Overview: core/en/combat/README.md
      - Attack and Defense: core/en/combat/attack_and_defense.md
      - Combat Decision Model: core/en/combat/combat_decision_model.md
      - Damage Model: core/en/combat/damage_model.md
      - Movement: core/en/combat/movement.md
  - Equipment:
      - Overview: core/en/equipment/README.md
      - Armor: core/en/equipment/armor.md
      - Gear: core/en/equipment/gear.md
      - Shields: core/en/equipment/shields.md
  - Weapons:
      - Overview: core/en/weapons/README.md
      - Categories:
          - Explosives: core/en/weapons/categories/explosives.md
          - Firearms: core/en/weapons/categories/firearms.md
          - Melee: core/en/weapons/categories/melee.md
      - Mechanics:
          - Penetration: core/en/weapons/mechanics/penetration.md
          - Weapon Ranges: core/en/weapons/mechanics/weapon_ranges.md
  - Reference:
      - Overview: core/en/reference/README.md
      - Character Sheet: core/en/reference/character_sheet.md
      - Combat Example: core/en/reference/combat_example.md
      - Combat Walkthrough: core/en/reference/combat_walkthrough.md
      - Extra: core/en/reference/extra.md
      - Gameplay Example: core/en/reference/gameplay_example.md
      - Gameplay Loop: core/en/reference/gameplay_loop.md
      - RGB Damage Interaction Model: core/en/reference/rgb_damage_interaction_model.md
      - RGB System Architecture Notes: core/en/reference/rgb_system_architecture_notes.md
      - RGB System Engine: core/en/reference/rgb_system_engine.md
