site_name: Regras Core do Sistema RGB
site_description: Exportacao PDF das regras Core do Sistema RGB.
docs_dir: ../docs
site_dir: ../web/landing/.pdfbuild/pt-br
use_directory_urls: true
exclude_docs: |
  adr/*
  architecture/*
  engineering/*
  plans/*
  overrides/*
  core/README.md
  core/en/*
  core/semantic/*
theme:
  name: mkdocs
  color_mode: dark
  nav_style: dark
extra_css:
  - styles/rgb-library.css
plugins:
  - search
  - to-pdf:
      author: RGB System
      copyright: RGB System
      cover: true
      cover_title: Regras Core do Sistema RGB
      cover_subtitle: Portugues do Brasil
      toc_title: Sumario
      toc_level: 3
      ordered_chapter_level: 3
      output_path: rgb-system-core-v2-latest-pt-br.pdf

nav:
  - Visao Geral Core: core/PT-br/README.md
  - Introducao:
      - Inicio Rapido: core/PT-br/introduction/quick_start.md
      - Regras em Uma Pagina: core/PT-br/introduction/rgb_one_page_rules.md
      - Visao Geral do Sistema: core/PT-br/introduction/system_overview.md
  - Regras Core:
      - Visao Geral: core/PT-br/core/README.md
      - Atributos: core/PT-br/core/attributes.md
      - Criacao de Personagem: core/PT-br/core/character_creation.md
      - Progressao: core/PT-br/core/progression.md
      - Pericias e Habilidades: core/PT-br/core/skills_and_abilities.md
  - Combate:
      - Visao Geral: core/PT-br/combat/README.md
      - Ataque e Defesa: core/PT-br/combat/attack_and_defense.md
      - Modelo de Decisao em Combate: core/PT-br/combat/combat_decision_model.md
      - Modelo de Dano: core/PT-br/combat/damage_model.md
      - Movimento: core/PT-br/combat/movement.md
  - Equipamento:
      - Visao Geral: core/PT-br/equipment/README.md
      - Armadura: core/PT-br/equipment/armor.md
      - Equipamentos Gerais: core/PT-br/equipment/gear.md
      - Escudos: core/PT-br/equipment/shields.md
  - Armas:
      - Visao Geral: core/PT-br/weapons/README.md
      - Categorias:
          - Explosivos: core/PT-br/weapons/categories/explosives.md
          - Armas de Fogo: core/PT-br/weapons/categories/firearms.md
          - Corpo a Corpo: core/PT-br/weapons/categories/melee.md
      - Mecanicas:
          - Penetracao: core/PT-br/weapons/mechanics/penetration.md
          - Alcances de Armas: core/PT-br/weapons/mechanics/weapon_ranges.md
  - Referencia:
      - Visao Geral: core/PT-br/reference/README.md
      - Ficha de Personagem: core/PT-br/reference/character_sheet.md
      - Exemplo de Combate: core/PT-br/reference/combat_example.md
      - Passo a Passo de Combate: core/PT-br/reference/combat_walkthrough.md
      - Extra: core/PT-br/reference/extra.md
      - Exemplo de Jogo: core/PT-br/reference/gameplay_example.md
      - Loop de Jogo: core/PT-br/reference/gameplay_loop.md
      - Modelo de Interacao de Dano RGB: core/PT-br/reference/rgb_damage_interaction_model.md
      - Notas de Arquitetura do Sistema RGB: core/PT-br/reference/rgb_system_architecture_notes.md
      - Motor do Sistema RGB: core/PT-br/reference/rgb_system_engine.md
