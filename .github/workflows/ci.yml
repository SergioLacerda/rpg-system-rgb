name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOLANGCI_LINT_VERSION: "v2.11.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      - run: make check-fast

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make docs-build

  docs-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: make docs-pdf
      - run: make pdf-editorial-check
      - uses: actions/upload-artifact@v4
        with:
          name: landing-pdfs
          path: |
            web/landing/public/downloads/*.pdf
            web/landing/public/downloads/*.json
            web/landing/public/downloads/SHA256SUMS
          retention-days: 7

  generated-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check-generated-drift

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/landing/package-lock.json
      - run: make lint-web

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/landing/package-lock.json
      - run: make test-web

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-yaml

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-shell

  governance-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-governance-files

  deploy:
    needs: [lint, docs, docs-pdf, generated-drift, lint-web, test-web, lint-yaml, lint-shell, governance-files]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/landing/package-lock.json
      - run: make landing-install
      - uses: actions/download-artifact@v4
        with:
          name: landing-pdfs
          path: web/landing/public/downloads
      - run: make landing-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/landing/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test-pdf:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check latest PDF downloads
        run: scripts/ci/check-pdf-links.sh "${{ needs.deploy.outputs.page_url }}"
